services:
  manga-drama-studio:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: manga-drama-studio:latest
    container_name: manga-drama-studio
    env_file:
      - .env
    ports:
      - "${APP_PUBLIC_PORT:-3001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  studio-data:
